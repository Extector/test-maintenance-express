name: stock-poc

services:
  db:
    image: postgres:18-alpine
    container_name: postgres-stock-poc
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stock-poc
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
volumes:
  postgres_data: